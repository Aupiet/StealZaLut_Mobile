name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow scipy color-matcher pytest

      - name: Run pytest
        env:
          PYTHONPATH: app/src/main/python
        run: |
          pytest tests/ -v

  android-tests:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python for Chaquopy build
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin Debug Compilation
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
