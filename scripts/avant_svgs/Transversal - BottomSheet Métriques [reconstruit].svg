            <rect x="0" y="0" width="390" height="670" fill="#000000" opacity="0.75"/>
    <g transform="translate(0, 240)">
        <rect x="0" y="0" width="390" height="440" rx="20" fill="#1A1D24" stroke="#383E4D" stroke-width="1"/>
        <rect x="175" y="8" width="40" height="4" rx="2" fill="#A0A7B5"/>
        <text x="24" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F0F2F5">Comprendre les métriques couleur</text>
        
        <g transform="translate(24, 60)">
            <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFB300">1. Delta E 2000 (ΔE₀₀)</text>
            <text x="0" y="34" font-family="sans-serif" font-size="11" fill="#A0A7B5">Mesure la différence perçue par l'œil humain entre deux couleurs. Un score &lt; 2.0 est indécelable à l'œil nu.</text>
            
            <text x="0" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFB300">2. PSNR (Peak Signal-to-Noise Ratio)</text>
            <text x="0" y="92" font-family="sans-serif" font-size="11" fill="#A0A7B5">Exprimé en décibels (dB). Évalue la fidélité de reconstruction. Une valeur supérieure à 35 dB indique une qualité studio sans artefact.</text>
            
            <text x="0" y="132" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFB300">3. 3D LUT (.CUBE)</text>
            <text x="0" y="150" font-family="sans-serif" font-size="11" fill="#A0A7B5">Table de correspondance tridimensionnelle standardisée dans l'industrie cinématographique (DaVinci Resolve, Premiere Pro, Lightroom).</text>
            
            <text x="0" y="190" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFB300">4. Algorithme HM-MKL-HM</text>
            <text x="0" y="208" font-family="sans-serif" font-size="11" fill="#A0A7B5">Combinaison d'un histogram matching initial et du transport optimal Monge-Kantorovich pour un transfert chromatique sans dérive spectrale.</text>
        </g>
        
        <rect x="24" y="320" width="342" height="44" rx="22" fill="#FFB300"/>
        <text x="195" y="347" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E1400">J'ai compris</text>
    </g>
