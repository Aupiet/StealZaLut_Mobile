<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960">
    <rect width="1200" height="960" rx="16" fill="#121417" stroke="#383E4D" stroke-width="2"/>
    
    <!-- Title Header -->
    <rect x="0" y="0" width="1200" height="70" rx="16" fill="#1A1D24" stroke="#383E4D" stroke-width="1"/>
    <text x="30" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#FFB300">StealZaLUT Mobile — Matrice d'Analyse des Problèmes de Design (Phase 2)</text>
    <text x="940" y="42" font-family="monospace" font-size="12" fill="#A0A7B5">Audit 17 Méthodes UX/UI &amp; FE-xxx</text>
    
    <!-- Summary Stats Chips -->
    <g transform="translate(30, 85)">
        <rect x="0" y="0" width="220" height="40" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
        <text x="16" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#EF4444">4 Anomalies Critiques (P0/P1)</text>
        
        <rect x="235" y="0" width="220" height="40" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="251" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">10 Anomalies Élevées (P1/P2)</text>
        
        <rect x="470" y="0" width="230" height="40" rx="8" fill="#262A34" stroke="#383E4D" stroke-width="1.5"/>
        <text x="486" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F0F2F5">8 Améliorations Confort (P3)</text>
        
        <rect x="715" y="0" width="455" height="40" rx="8" fill="#3D2D00" stroke="#FFB300" stroke-width="1.5"/>
        <text x="731" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Objectif Après : Application Chic, Ludique &amp; 100% Modulaire</text>
    </g>
    
    <!-- Table Header -->
    <g transform="translate(30, 145)">
        <rect x="0" y="0" width="1140" height="36" rx="6" fill="#262A34"/>
        <text x="15" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F0F2F5">Écran / Composant</text>
        <text x="210" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F0F2F5">Problème UX / UI constaté</text>
        <text x="590" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F0F2F5">Règle violée</text>
        <text x="740" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F0F2F5">Gravité</text>
        <text x="830" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F0F2F5">Correction prévue (Phase 4 &amp; 5)</text>
    </g>
    
    <!-- Table Rows -->
    <g transform="translate(30, 185)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Navigation</text>
        <text x="210" y="24" font-family="sans-serif" font-size="11" fill="#F0F2F5">Double barre de navigation superposée (140dp en bas)</text>
        <text x="210" y="40" font-family="sans-serif" font-size="10" fill="#A0A7B5">Risque de frappes parasites sur Palettes/Profil pendant la retouche</text>
        <text x="590" y="30" font-family="monospace" font-size="11" fill="#FFB300">FE-002 • M2, M7</text>
        <rect x="735" y="16" width="70" height="22" rx="4" fill="#450A0A"/>
        <text x="770" y="31" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EF4444">CRITIQUE</text>
        <text x="830" y="30" font-family="sans-serif" font-size="11" fill="#22C55E">Masquer NavigationBar quand currentDestination==EDITOR &amp;&amp; photo!=null</text>
        
        <!-- Row 2 -->
        <rect x="0" y="58" width="1140" height="52" fill="#262A34" rx="4"/>
        <text x="15" y="88" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Outils</text>
        <text x="210" y="82" font-family="sans-serif" font-size="11" fill="#F0F2F5">Absence totale d'outil de recadrage &amp; ratios (Crop &amp; Straighten)</text>
        <text x="210" y="98" font-family="sans-serif" font-size="10" fill="#A0A7B5">Outil universel standard présent dans 100% des éditeurs photo</text>
        <text x="590" y="88" font-family="monospace" font-size="11" fill="#FFB300">FE-005 • M1</text>
        <rect x="735" y="74" width="70" height="22" rx="4" fill="#450A0A"/>
        <text x="770" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EF4444">CRITIQUE</text>
        <text x="830" y="88" font-family="sans-serif" font-size="11" fill="#22C55E">Créer EditorCropOverlay tactile avec poignées, ratios 1:1, 4:5, 16:9, redressement</text>
        
        <!-- Row 3 -->
        <rect x="0" y="116" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="146" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Session</text>
        <text x="210" y="140" font-family="sans-serif" font-size="11" fill="#F0F2F5">Perte totale d'état en cas d'arrêt du processus Android (RAM kill)</text>
        <text x="210" y="156" font-family="sans-serif" font-size="10" fill="#A0A7B5">SavedStateHandle absent du ViewModel</text>
        <text x="590" y="146" font-family="monospace" font-size="11" fill="#FFB300">FE-015 • Architecture</text>
        <rect x="735" y="132" width="70" height="22" rx="4" fill="#450A0A"/>
        <text x="770" y="147" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EF4444">CRITIQUE</text>
        <text x="830" y="146" font-family="sans-serif" font-size="11" fill="#22C55E">Injecter SavedStateHandle, sérialiser URI source et JSON LightroomDevelopModel</text>
        
        <!-- Row 4 -->
        <rect x="0" y="174" width="1140" height="52" fill="#262A34" rx="4"/>
        <text x="15" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Undo-Redo</text>
        <text x="210" y="198" font-family="sans-serif" font-size="11" fill="#F0F2F5">Pile Undo/Redo factice n'enregistrant aucun mouvement de curseur</text>
        <text x="210" y="214" font-family="sans-serif" font-size="10" fill="#A0A7B5">pushUndoSnapshot() n'est appelé que sur les resets globaux</text>
        <text x="590" y="204" font-family="monospace" font-size="11" fill="#FFB300">FE-006 • M7</text>
        <rect x="735" y="190" width="70" height="22" rx="4" fill="#451A03"/>
        <text x="770" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F59E0B">ÉLEVÉE</text>
        <text x="830" y="204" font-family="sans-serif" font-size="11" fill="#22C55E">Déclencher pushUndoSnapshot() à chaque onValueChangeFinished de curseur</text>
        
        <!-- Row 5 -->
        <rect x="0" y="232" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="262" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Curseurs</text>
        <text x="210" y="256" font-family="sans-serif" font-size="11" fill="#F0F2F5">Faux double-tap reset (un simple tap réinitialise) + Cibles 44dp</text>
        <text x="210" y="272" font-family="sans-serif" font-size="10" fill="#A0A7B5">Taille de police labelSmall à 10sp trop petite pour grossissement 200%</text>
        <text x="590" y="262" font-family="monospace" font-size="11" fill="#FFB300">FE-007, FE-019, FE-023 • M5, M11</text>
        <rect x="735" y="248" width="70" height="22" rx="4" fill="#451A03"/>
        <text x="770" y="263" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F59E0B">ÉLEVÉE</text>
        <text x="830" y="262" font-family="sans-serif" font-size="11" fill="#22C55E">Vrai combinedClickable(onDoubleClick), cibles ≥48dp, taille texte min 12sp</text>

        <!-- Row 6 -->
        <rect x="0" y="290" width="1140" height="52" fill="#262A34" rx="4"/>
        <text x="15" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Code mort</text>
        <text x="210" y="314" font-family="sans-serif" font-size="11" fill="#F0F2F5">Panneaux Géométrie &amp; Corrections optiques orphelins hors toolbar</text>
        <text x="210" y="330" font-family="sans-serif" font-size="10" fill="#A0A7B5">EditorTransformPanel &amp; EditorLensCorrectionsPanel non branchés</text>
        <text x="590" y="320" font-family="monospace" font-size="11" fill="#FFB300">FE-009 • M7, M15</text>
        <rect x="735" y="306" width="70" height="22" rx="4" fill="#451A03"/>
        <text x="770" y="321" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F59E0B">ÉLEVÉE</text>
        <text x="830" y="320" font-family="sans-serif" font-size="11" fill="#22C55E">Ajouter Géométrie et Optique dans EditorToolbar avec icônes et légendes</text>

        <!-- Row 7 -->
        <rect x="0" y="348" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="378" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Viewport</text>
        <text x="210" y="372" font-family="sans-serif" font-size="11" fill="#F0F2F5">Double-tap réinitialisation zoom (1x) absent + Histogramme sans clipping</text>
        <text x="210" y="388" font-family="sans-serif" font-size="10" fill="#A0A7B5">Pinch-zoom 1x..4x fonctionnel mais impossible de revenir à 1x d'un tap</text>
        <text x="590" y="378" font-family="monospace" font-size="11" fill="#FFB300">FE-008, FE-017 • M4, M14</text>
        <rect x="735" y="364" width="70" height="22" rx="4" fill="#262A34"/>
        <text x="770" y="379" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A0A7B5">MOYENNE</text>
        <text x="830" y="378" font-family="sans-serif" font-size="11" fill="#22C55E">detectTapGestures(onDoubleTap = resetZoom) + Alerte clipping ombres/hautes lum.</text>

        <!-- Row 8 -->
        <rect x="0" y="406" width="1140" height="52" fill="#262A34" rx="4"/>
        <text x="15" y="436" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Éditeur / Export</text>
        <text x="210" y="430" font-family="sans-serif" font-size="11" fill="#F0F2F5">Export HD direct sans dialogue d'options (format, qualité, dimension, poids)</text>
        <text x="210" y="446" font-family="sans-serif" font-size="10" fill="#A0A7B5">Pas d'estimation de la taille du fichier avant l'encodage</text>
        <text x="590" y="436" font-family="monospace" font-size="11" fill="#FFB300">FE-013 • M3, M10</text>
        <rect x="735" y="422" width="70" height="22" rx="4" fill="#262A34"/>
        <text x="770" y="437" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A0A7B5">MOYENNE</text>
        <text x="830" y="436" font-family="sans-serif" font-size="11" fill="#22C55E">Boîte de dialogue modale d'exportation avec sélecteur JPEG/PNG, qualité et poids</text>

        <!-- Row 9 -->
        <rect x="0" y="464" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="494" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Thèmes &amp; Système</text>
        <text x="210" y="488" font-family="sans-serif" font-size="11" fill="#F0F2F5">Pas de suivi Jour/Nuit système ni de couleurs dynamiques Material You</text>
        <text x="210" y="504" font-family="sans-serif" font-size="10" fill="#A0A7B5">Thèmes figés manuellement dans AppSettings sans écouter le mode système</text>
        <text x="590" y="494" font-family="monospace" font-size="11" fill="#FFB300">FE-020, FE-021 • M6, M16</text>
        <rect x="735" y="480" width="70" height="22" rx="4" fill="#262A34"/>
        <text x="770" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A0A7B5">MOYENNE</text>
        <text x="830" y="494" font-family="sans-serif" font-size="11" fill="#22C55E">Option SYSTEM_DEFAULT avec isSystemInDarkTheme() + dynamicDarkColorScheme</text>

        <!-- Row 10 -->
        <rect x="0" y="522" width="1140" height="52" fill="#262A34" rx="4"/>
        <text x="15" y="552" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Intégration Android</text>
        <text x="210" y="546" font-family="sans-serif" font-size="11" fill="#F0F2F5">Absence d'Intent Filters ACTION_EDIT / ACTION_SEND &amp; Photo Picker moderne</text>
        <text x="210" y="562" font-family="sans-serif" font-size="10" fill="#A0A7B5">Impossible d'ouvrir une photo depuis Google Photos ; GetContent() au lieu de PickVisualMedia</text>
        <text x="590" y="552" font-family="monospace" font-size="11" fill="#FFB300">FE-028, FE-030 • M16</text>
        <rect x="735" y="538" width="70" height="22" rx="4" fill="#451A03"/>
        <text x="770" y="553" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F59E0B">ÉLEVÉE</text>
        <text x="830" y="552" font-family="sans-serif" font-size="11" fill="#22C55E">Déclarer ACTION_EDIT/SEND dans Manifest + ActivityResultContracts.PickVisualMedia</text>

        <!-- Row 11 -->
        <rect x="0" y="580" width="1140" height="52" fill="#1A1D24" rx="4"/>
        <text x="15" y="610" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFB300">Design System Guard</text>
        <text x="210" y="604" font-family="sans-serif" font-size="11" fill="#F0F2F5">Test de garde permissif avec whitelist d'exceptions masquant les violations</text>
        <text x="210" y="620" font-family="sans-serif" font-size="10" fill="#A0A7B5">Direct calls to Icons.*, .dp, .sp autorisés silencieusement dans 5 fichiers</text>
        <text x="590" y="610" font-family="monospace" font-size="11" fill="#FFB300">FE-026 • Architecture DS</text>
        <rect x="735" y="596" width="70" height="22" rx="4" fill="#262A34"/>
        <text x="770" y="611" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A0A7B5">MOYENNE</text>
        <text x="830" y="610" font-family="sans-serif" font-size="11" fill="#22C55E">Supprimer allowedExceptions, interdire Icons.*, FontFamily(...) bruts dans screens</text>
    </g>
</svg>